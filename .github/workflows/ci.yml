name: CI

# 推送 / PR 触发：编译后端 + 跑单元测试 + 构建前端。
# 测试作业跑在 windows-latest（发布目标只有 Windows x64），前端作业留在 ubuntu（更快）。
on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 8.0.x
  NODE_VERSION: "20"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    name: 编译与单元测试
    # 发布目标只有 Windows，测试也放到 Windows 上跑：IEC 61850 的原生用例会真正执行
    # （在 Linux runner 上因为没有 .so 会被 NativeLibraryFact 跳过）
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 编译
        run: dotnet build EssSimulator.csproj -c Release --nologo

      - name: 单元测试
        run: |
          dotnet test EssSimulator.Tests/EssSimulator.Tests.csproj \
            -c Release --nologo --logger "console;verbosity=normal"

  web:
    name: 前端构建
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Web/package-lock.json

      # Vite 的 build.outDir 指向仓库根 wwwroot/
      - name: 构建
        working-directory: Web
        run: |
          npm ci
          npm run build

      - name: 确认产物存在
        run: test -f wwwroot/index.html
